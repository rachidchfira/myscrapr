[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mapslead"
version = "0.1.0"
description = "Local CLI for Google Maps lead collection and website enrichment."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16,<1",
    "pydantic>=2.11,<3",
    "platformdirs>=4.3,<5",
    "scrapling[fetchers]>=0.4.14,<0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "build>=1.2,<2",
]

[project.scripts]
mapslead = "mapslead.cli:app"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
